[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shades2shapes"
version = "0.1.0"
description = "Diagnose and discriminate spatial patterns (filaments, networks, texture, eddies) in images of filamentous structures such as phytoplankton blooms."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tristan Harmel" }]
keywords = ["image analysis", "texture", "ocean color", "phytoplankton", "eddies", "filaments",
            "satellite", "xarray"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-image>=0.20",
    "scikit-learn>=1.1",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest"]
geo = ["xarray>=2022.6", "rioxarray>=0.13", "netCDF4", "zarr"]
docs = [
    "sphinx>=7",
    "sphinx-book-theme>=1.1",
    "myst-nb>=1.0",
    "sphinx-copybutton",
    "linkify-it-py",
    "ipykernel",
]

[project.scripts]
shades2shapes = "shades2shapes.cli:main"
s2s = "shades2shapes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
